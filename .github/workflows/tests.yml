name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Proyek ini memakai MySQL di dev, test, dan produksi. CI harus memakai
    # mesin database yang sama agar fitur MySQL-spesifik tidak lolos diam-diam.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: sigap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # phpunit.xml memaksa DB_DATABASE=sigap_testing; service di atas hanya
      # membuat database `sigap`, jadi database test dibuat manual di sini.
      - name: Create test database
        run: mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS sigap_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
